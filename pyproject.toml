[project]
name = "kitchensink4word"
version = "2.1.1"
description = "Word (.docx) MCP server: 221 operations, live editing, tracked changes, citations, document assembly, mail merge. The kitchen sink."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "nometalalchemist" }]
keywords = [
    "mcp", "word", "docx", "ooxml", "claude", "model-context-protocol",
    "live-editing", "citations", "bibliography", "footnotes",
    "table-of-contents", "tracked-changes", "document-compare", "tables",
    "mail-merge", "redaction", "accessibility", "compliance", "forms",
    "batch-processing", "pdf-import",
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4,<4",
    "latex2mathml>=3.81",
    "mathml2omml>=0.0.2",
    "python-docx",
    "lxml",
    "regex",
    "packaging",  # version comparison for the startup update check
    "pywin32; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-timeout",
]

[project.urls]
Homepage = "https://kitchensink4.ai"
Documentation = "https://github.com/KitchenSink4AI/KitchenSink4Word#readme"
Repository = "https://github.com/KitchenSink4AI/KitchenSink4Word"
Issues = "https://github.com/KitchenSink4AI/KitchenSink4Word/issues"

[project.scripts]
word-mcp = "word_mcp.server:main"
kitchensink4word = "word_mcp.server:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
markers = [
    "live: needs an interactive Word instance (auto-skipped where Word is unavailable)",
]
